<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Privilege Auction</title>
  <desc id="desc">C++17 library for gamification with dynamic task pricing, reward scoring, and multi-slot privilege auctions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13233f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>

  <circle cx="1040" cy="150" r="118" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="1040" cy="150" r="86" fill="none" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="1040" cy="150" r="54" fill="#38bdf8" fill-opacity="0.08"/>

  <g transform="translate(986 82) rotate(-32)">
    <rect x="0" y="0" width="88" height="36" rx="9" fill="#fbbf24"/>
    <rect x="34" y="36" width="20" height="86" rx="9" fill="#e2e8f0"/>
  </g>

  <rect x="80" y="62" width="72" height="8" rx="4" fill="url(#accent)"/>

  <text x="80" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc">
    Privilege Auction
  </text>
  <text x="82" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94a3b8">
    Dynamic task pricing · Reward scoring · Multi-slot privilege auctions
  </text>
  <text x="82" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#38bdf8" letter-spacing="4">
    C++17 · CMAKE · LIBRARY
  </text>
</svg>
