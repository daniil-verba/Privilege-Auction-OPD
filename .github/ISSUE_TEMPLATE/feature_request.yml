name: Feature request
description: Предложить новую возможность или улучшение
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему нужно решить?
      description: Опишите ситуацию, в которой текущего API или поведения не хватает
      placeholder: Сейчас нельзя ..., из-за этого ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как вы видите новую функцию или изменение API?
      placeholder: Добавить метод ..., который ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
      description: Какие ещё варианты вы рассматривали и почему они не подходят?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Область изменений
      options:
        - Расчёт наград (scoring)
        - Аукцион и привилегии
        - Публичный API и типы
        - Сборка и CI/CD
        - Документация
        - Другое
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я проверил(а), что такой функциональности ещё нет в ветке dev
          required: true
        - label: Предложение не противоречит текущей спецификации из docs/
          required: false
